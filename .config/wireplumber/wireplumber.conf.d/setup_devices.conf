monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3"
      }
    ]
    actions = {
      update-props = {
        device.description = "Laptop's AudioBoard"
      }
    }
  },
  {
    matches = [
      {
        device.name = "alsa_card.usb-DJI_Technology_Co.__Ltd._Wireless_Mic_Rx_XSP12345678B-01"
      }
    ]
    actions = {
      update-props = {
        device.description = "DJI Wireless Mic Rx"
      }
    }
  }
]